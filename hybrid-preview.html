<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FrameForge Hybrid Renderer — Beta</title>
<style>body{margin:0;background:#101821;color:#cbd5e1;font:12px system-ui}canvas{display:block;max-width:100%;height:auto;margin:0 auto}#msg{text-align:center;padding:5px}</style></head>
<body><div id="msg">Loading the real FrameForge hybrid scene…</div>
<script src="./src/project-core.js"></script>
<script src="./src/hybrid-project-core.js"></script>
<script src="./src/hybrid-providers.js"></script>
<script src="./src/hybrid-direction.js"></script>
<script src="./src/speech-performance-core.js"></script>
<script>window.HybridP56Error=null;addEventListener('error',e=>window.HybridP56Error=e.message);addEventListener('unhandledrejection',e=>window.HybridP56Error=String(e.reason?.stack||e.reason));</script>
<script>
// Phase 4: check for WebGL before starting the 3D engine, so a browser without it gets a clear message, not a crash.
(function(){let ok=false;try{const c=document.createElement('canvas');ok=Boolean(c.getContext('webgl2')||c.getContext('webgl'))}catch{}
 if(!ok){window.HybridP56Error='WEBGL_UNAVAILABLE';document.getElementById('msg').textContent='3D graphics (WebGL) are unavailable in this browser.';return}
 const s=document.createElement('script');s.type='module';s.src='./src/hybrid-preview-engine.mjs';document.body.append(s);})();
</script></body></html>
