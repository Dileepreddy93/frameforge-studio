<!doctype html><html lang="en"><head><meta charset="utf-8"><title>FrameForge P3 P4 validated model and worlds proof</title><style>body{background:#0c1527;color:white;font:14px system-ui}canvas{display:block;max-width:100%;margin:auto}</style></head><body>
<div>P3/P4: real rigged GLB and Ember natural environments (engineering test only)</div>
<script>
window.HybridP34Error=null;
window.addEventListener('error',event=>{window.HybridP34Error=event.message+' '+(event.filename||'')});
window.addEventListener('unhandledrejection',event=>{window.HybridP34Error=String(event.reason?.stack||event.reason)});
</script>
<script src="../src/project-core.js"></script><script src="../src/hybrid-project-core.js"></script>
<script src="../src/hybrid-providers.js"></script>
<script type="module">
import * as T from '../vendor/three@0.180.0/three.module.min.js';
import {prepareRiggedCast,registerRiggedCharacters,auditRiggedAsset} from '../src/hybrid-rigged-provider.mjs';
import {prepareImportedWorld,registerEmberWorlds,validateWorldOptions,auditWorldAsset} from '../src/hybrid-world-provider.mjs';
const R=FrameForgeHybridProviders,C=FrameForgeHybridProjectCore;
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(300,500);renderer.setPixelRatio(1);document.body.append(renderer.domElement);
renderer.outputColorSpace=T.SRGBColorSpace;
const scene=new T.Scene(),camera=new T.PerspectiveCamera(39,300/500,.1,120);
const orig=await(await fetch('../projects/zero-latency.frameforge.json')).json();
const modelBytes=new Uint8Array(await(await fetch('../assets/rigged-samples/CesiumMan.glb')).arrayBuffer());
const store=R.createMemoryAssetStore();
store.put({id:'rig-one',kind:'character',uri:'asset://rig-one'},modelBytes);
store.put({id:'world-one',kind:'world',uri:'asset://world-one'},modelBytes);
const audit=auditRiggedAsset(modelBytes,'CesiumMan.glb');
let project=C.upgradeLegacyProject(orig);
project.id='p3p4-rigged-world';
project.characters=[{id:'hero',name:'CesiumMan',visualIdentity:'Third-party CC BY test rig',
 voice:{profile:'test',voiceLock:'Audited test track'},expressions:['neutral','happy','sad','angry','surprised','worried','curious','idea'],
 sheetStatus:'draft'}];
const emotions=['neutral','happy','sad','angry','surprised','worried','curious','idea'];
project.shots=emotions.map((e,i)=>({id:'shot-'+(i+1),speaker:'hero',dialogue:'Original test scene '+e+'.',
 duration:2.2,intent:'facial and body acting',camera:{kind:'actor',target:'hero'},
 cast:{hero:{emotion:e,action:['explain','wave','shrug','point','nod','think','wave','cheer'][i]}},
 firstFrameStatus:'draft'}));
project.audio={state:'storyboard_only',masterUrl:null};
project.hybrid={version:1,cast:{hero:{provider:'rigged',assetId:'rig-one',filename:'CesiumMan.glb'}},
 world:{provider:'procedural',template:'forest',time:'golden',foliage:.07,particles:['dust']},
 assets:[{id:'rig-one',kind:'character',uri:'asset://rig-one'}]};
const registry=R.createRegistry();
const prepared=await prepareRiggedCast(project,store);
const importWorldProject={...project,hybrid:{...project.hybrid,world:{provider:'imported',assetId:'world-one'}}};
const preparedWorld=await prepareImportedWorld(importWorldProject,store);
registerRiggedCharacters(registry,{scene,prepared,positions:{hero:[0,0,0]}});
registerEmberWorlds(registry,{scene,renderer,preparedWorld});
registry.lock();
const initial=project.hybrid.world;
let session=null;
const make=async(template='forest',time='golden',imported=false)=>{
 if(session)session.dispose();
 project.hybrid.world=imported?{provider:'imported',assetId:'world-one'}:
 {provider:'procedural',template,time,foliage:.07,particles:template==='snow'?['snow']:['dust']};
 if(imported&&!project.hybrid.assets.find(x=>x.id==='world-one'))
  project.hybrid.assets.push({id:'world-one',kind:'world',uri:'asset://world-one'});
 const v=C.validateProject(project);
 if(!v.valid)throw Error('World project invalid '+JSON.stringify(v.errors));
 const fresh=await prepareRiggedCast(project,store);
 prepared.set('hero',fresh.get('hero'));
 session=R.createSession(project,{registry,assets:store});
 return {world:project.hybrid.world,actor:session.instances().get('hero').getReport()};
};
const image=(t=0.5,view=0)=>{
 const rig=session.instances().get('hero').getRig();
 rig.root.rotation.y=[0,Math.PI/2,Math.PI,Math.PI*1.5][view];
 const frame=session.seek(t);
 camera.position.set(0,3.05,8.5);camera.lookAt(0,1.7,0);
 renderer.render(scene,camera);
 return {image:renderer.domElement.toDataURL('image/png'),frame,meshes:session.world().getGroup().children.length,
   actor:session.instances().get('hero').getReport()};
};
await make();
window.HybridP34QA={
 audit,options:validateWorldOptions,
 prepareWorld:async()=>{const temp={...project,hybrid:{...project.hybrid,world:{provider:'imported',assetId:'world-one'}}};
   return {ready:Boolean(preparedWorld.gltf.scene),meshes:preparedWorld.sceneInfo.meshes};},
 make,image,
 summary:()=>({source:'CesiumMan.glb (Khronos Cesium CC BY 4.0)',bytes:modelBytes.length,
  kind:audit.report.format,rigged:audit.report.ok,triangles:audit.report.triangles}),
 dispose:()=>{session?.dispose();renderer.dispose()}
};
window.HybridP34Ready=true;
</script></body></html>
